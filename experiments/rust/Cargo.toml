[package]
name = "case-watch-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "time", "sync", "signal", "io-util", "test-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "cookies", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
uuid = { version = "=1.29.2", features = ["v4"] }

[profile.release]
strip = "symbols"
