services:
  case-watch-rust:
    image: case-watch-rust:0.1.0-alpine
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: experiments/rust/Dockerfile
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      CASE_WATCH_TELEGRAM_BOT_TOKEN: ${CASE_WATCH_TELEGRAM_BOT_TOKEN:?required}
      CASE_WATCH_DB_PATH: /data/case-watch-rust.db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    volumes:
      - rust-data:/data
volumes:
  rust-data:
    name: case-watch-rust-data
